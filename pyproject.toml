[project]
name = "liora-london-firefighter"
version = "0.1.0"
description = "London Fire Brigade attendance-time training and scenario simulation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.4",
    "pandas==2.3.3",
    "PyYAML==6.0.3",
]

[dependency-groups]
model = [
    "category-encoders==2.9.0",
    "joblib==1.5.3",
    "pyarrow==24.0.0",
    "scikit-learn==1.8.0",
    "xgboost==2.1.1",
]
api = [
    { include-group = "model" },
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
]
ui = [
    "streamlit==1.58.0",
    "pydeck==0.9.1",
    "requests==2.32.4",
]
train = [
    { include-group = "model" },
    "mlflow==3.13.0",
    "holidays==0.95",
    "openpyxl==3.1.5",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "pyproj==3.7.2",
    "geopandas==1.1.3",
    "networkx==3.6.1",
    "osmnx==2.1.0",
    "shapely==2.1.2",
]
dev = ["pytest==9.0.2", "httpx>=0.28,<0.29"]
analysis = ["shap>=0.48,<0.51", "jupyterlab>=4,<5"]
advanced = ["lightgbm==4.5.0", "catboost>=1.2.8,<1.3"]

[tool.uv]
package = false
default-groups = ["train", "api", "ui", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
